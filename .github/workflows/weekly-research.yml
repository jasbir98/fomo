name: Weekly Edinburgh research

# Runs scraper/weekly_edinburgh.py (docs/weekly-pipeline.md): lifecycle sweep,
# publisher pages, page-grounded deal sources, 47 narrow DeepSeek topics, source re-verification, then
# upserts candidates into `happenings_staging`. It never publishes on the
# schedule: every publish is reviewed first (approve rows with the SQL in the
# run's report), then promoted with a manual "promote" run.
on:
  schedule:
    # Monday 11:23 UTC, so the staged batch is ready to review before the
    # Wednesday carousel and Friday email (weekly-content.yml). After
    # DeepSeek's weekday peak (01-04 and 06-10 UTC, double price): Fomo never
    # calls DeepSeek in peak (scraper/deepseek_hours.py).
    - cron: "23 11 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "stage (research + stage for review), dry-run (no API/DB), or promote (publish approved rows)"
        required: true
        default: "stage"
        type: choice
        options:
          - stage
          - dry-run
          - promote
      batch_id:
        description: "promote only: batch id from the report, e.g. edi-weekly-2026-10-05 (blank = every approved row)"
        required: false
        default: ""

# Least privilege: jobs only check out code and upload artifacts.
permissions:
  contents: read

# Never two research runs at once: they'd both spend the DeepSeek budget.
concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name == 'schedule' || inputs.mode != 'promote' }}
    runs-on: ubuntu-latest
    environment: Production
    # --workers 1: concurrent DeepSeek research calls have crashed the
    # streaming path (seen 2026-09-14), so topics run one at a time.
    # 340, not 240: a scheduled run GitHub starts late, inside or just before a
    # DeepSeek peak window, can wait up to ~5 h for off-peak before it starts.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # Playwright (in requirements.txt) isn't used by this script; skip the
      # browser download.
      - name: Install dependencies
        run: pip install "requests>=2.31,<3" "python-dotenv>=1.0,<2" "anthropic>=0.40,<1" "pyyaml>=6,<7"

      # DeepSeek bills double 01-04 and 06-10 UTC on weekdays. GitHub starts
      # scheduled runs hours late, so a scheduled run waits for a clear
      # off-peak hour; a manual run in peak stops at once with the next start
      # time instead of idling on paid Actions minutes. llm_client.py refuses
      # DeepSeek in peak regardless, so this step only avoids a wasted run.
      - name: Wait for DeepSeek off-peak
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'stage' }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python3 scraper/deepseek_hours.py --wait 60
          else
            python3 scraper/deepseek_hours.py --check 60
          fi

      - name: Run weekly research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode || 'stage' }}
        run: |
          if [[ "$MODE" == "dry-run" ]]; then
            python3 scraper/weekly_edinburgh.py --dry-run
          else
            if [[ -z "$DEEPSEEK_API_KEY" ]]; then
              echo "::error::DEEPSEEK_API_KEY is not set on the Production environment."
              exit 1
            fi
            python3 scraper/weekly_edinburgh.py --stage --workers 1
          fi

      - name: Add report to the run summary
        if: always()
        run: |
          report=$(ls -t scraper/out/edi-weekly-*/weekly-report.md 2>/dev/null | head -n 1)
          if [[ -n "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload batch output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-${{ github.run_number }}
          path: scraper/out/edi-weekly-*/
          if-no-files-found: ignore
          retention-days: 30

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'promote' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only rows already marked approved = true in happenings_staging move.
      - name: Promote approved rows
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: geocodes promoted rows that have no coordinates.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          if [[ -n "$BATCH_ID" ]]; then
            node scripts/promote-happenings.mjs --batch-id "$BATCH_ID"
          else
            node scripts/promote-happenings.mjs
          fi
