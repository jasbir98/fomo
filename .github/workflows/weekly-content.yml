name: Weekly content (carousel + email)

# Weekly IG carousel: Wednesday 16:07 UTC (Actions schedule; a late run is fine).
# Weekly email: no schedule here. Actions' cron ran 4-7 hours late, past the
# signup card's "Thursday by 6pm". A Vercel cron (vercel.json, Thu 15:00-15:59
# UTC) calls app/api/cron/weekly-email, which dispatches this workflow with
# action=email-send. Keeping one trigger means it can't double-send.
# Both can be triggered manually with `workflow_dispatch` (with input to pick carousel|email-dry-run|email-send)
on:
  schedule:
    # Wednesday 16:07 UTC (carousel)
    - cron: "7 16 * * 3"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run: carousel, email-dry-run, or email-send"
        required: false
        default: "carousel"
        type: choice
        options:
          - carousel
          - email-dry-run
          - email-send

# Least privilege: jobs only check out code and upload artifacts.
permissions:
  contents: read

jobs:
  carousel:
    # Run carousel job on Wednesday cron (schedule[0]) or if manually triggered with action=carousel
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '7 16 * * 3') ||
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'carousel' || inputs.action == ''))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Render IG carousel
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ig-carousel.mjs

      - name: Upload carousel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-carousel-${{ github.run_number }}
          path: scripts/out/ig-*/
          retention-days: 14

  email:
    # Dispatched with action=email-send by the Vercel cron, or by hand with action=email-*
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'email-dry-run' || inputs.action == 'email-send')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Sends on email-send, but only once RESEND_API_KEY is set; otherwise
      # (and for email-dry-run) it dry-runs.
      - name: Run weekend email
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          FOMO_FROM_EMAIL: ${{ vars.FOMO_FROM_EMAIL || secrets.FOMO_FROM_EMAIL || '' }}
          SENDER_ADDRESS: ${{ vars.SENDER_ADDRESS || secrets.SENDER_ADDRESS || '' }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ -n "$RESEND_API_KEY" && "$ACTION" == "email-send" ]]; then
            node scripts/fomo-friday.mjs --send
          else
            node scripts/fomo-friday.mjs --dry-run
          fi

      - name: Upload rendered email as artifact (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'email-dry-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: fomo-friday-html-${{ github.run_number }}
          path: scripts/out/fomo-friday-*
          retention-days: 14
