name: Probe event and deal sources

# Manual-only probe (scripts/probe-sources.mjs). Re-checks event/deal sites
# from GitHub's runners so we can tell real blocks from local-IP noise. It
# never tries to get past a block: one identifying bot UA, no retries,
# robots.txt obeyed. Results land in the job summary and a JSON artifact.
on:
  workflow_dispatch: {}

# Least privilege: read-only checkout, artifact upload needs no write scope.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe sources
        run: node scripts/probe-sources.mjs

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-sources
          path: scraper/out/probe-*.json
          if-no-files-found: warn
