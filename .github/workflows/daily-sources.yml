name: Daily Tier-1 events ingest

# Crawls lu.ma, Eventbrite, Songkick and allevents.in's Edinburgh listing
# pages, plus a proactive paginated pull of the Skiddle and Ticketmaster
# APIs (scripts/daily-sources.mjs) and upserts normalized rows into the
# `events` table. See docs/daily-sources.md for the sources, required
# secrets, and how to run this by hand.
on:
  schedule:
    # 11:17 UTC daily — off-the-hour on purpose, same reasoning any cron
    # scheduling guide gives: avoids the top-of-hour pile-up on GitHub's
    # shared runners. After DeepSeek's 06:00-10:00 UTC weekday peak (double
    # price, scraper/deepseek_hours.py): the Jazz Bar adapter's DeepSeek
    # fallback refuses to run in peak anyway, but GitHub starts these runs
    # hours late, so starting after the window keeps the fallback available.
    - cron: "17 11 * * *"
    # Second pass: GitHub drops scheduled runs under load (the first morning
    # run on 2026-09-27 never fired). Upserts are idempotent, so a double run
    # costs nothing.
    - cron: "43 17 * * *"
  workflow_dispatch: {}

# Least privilege: jobs only check out code and upload artifacts.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SKIDDLE_API_KEY /
    # TICKETMASTER_API_KEY live as Production environment secrets on
    # jasbir98/fomo, not repository secrets.
    environment: Production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run daily sources ingest
        # SKIDDLE_API_KEY / TICKETMASTER_API_KEY are optional: when unset,
        # daily-sources.mjs skips those two adapters gracefully (a log line,
        # not a failure) and still runs the remaining five sources (luma,
        # eventbrite, songkick, allevents JSON-LD pages, plus the
        # sneakypetes venue RSS feed — none of which need a secret).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          FESTIVALS_API_KEY: ${{ secrets.FESTIVALS_API_KEY }}
          FESTIVALS_API_SECRET: ${{ secrets.FESTIVALS_API_SECRET }}
        run: node scripts/daily-sources.mjs --write

  # Weekly accuracy spot-check (Mondays): for each live provider, fetch 5
  # random upcoming events' own pages and confirm the title words and date
  # appear there (scripts/check-event-sample.mjs). Reported in the job summary;
  # never fails the workflow. Runs off the morning cron only (or by hand).
  sample-check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 11 * * *'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sample-check live providers
        env:
          EVENT_SCHEDULE: ${{ github.event_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$EVENT_SCHEDULE" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday: weekly sample check skipped."
            exit 0
          fi
          providers=$(node --input-type=module -e "import { ADAPTERS } from './scripts/sources/registry.mjs'; console.log(ADAPTERS.filter((a) => a.status === 'live').map((a) => a.name).join(' '))")
          {
            echo "### Weekly event sample check"
            echo
            echo "| provider | accuracy | result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $providers; do
            node scripts/check-event-sample.mjs --provider="$p" --n=5 || true
          done
